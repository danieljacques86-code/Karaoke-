<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤 Karaokê Show</title>

<link rel="stylesheet" href="styles/main.css">

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:black;
    color:white;
    overflow-x:hidden;
}

/* vídeo fundo */
#bgvideo{
    position:fixed;
    right:0;
    bottom:0;
    min-width:100%;
    min-height:100%;
    z-index:-2;
    object-fit:cover;
    opacity:0.35;
}

/* imagem lado direito */
.lado-direito{
    position:fixed;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    z-index:5;
}
.lado-direito img{
    width:200px;
    border-radius:12px;
    box-shadow:0 0 20px #000;
}

/* botão link */
.botao-link{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#00c853;
    padding:14px 18px;
    border-radius:12px;
    font-size:18px;
    color:white;
    text-decoration:none;
    box-shadow:0 0 15px #000;
    font-weight:bold;
}
.botao-link:hover{
    background:#00e676;
}

/* player */
.container{
    text-align:center;
    padding:20px;
}
.player iframe{
    width:90%;
    max-width:900px;
    height:500px;
    border-radius:12px;
    border:0;
    box-shadow:0 0 20px #000;
}

/* botões */
.controls button{
    padding:12px 18px;
    margin:6px;
    border-radius:10px;
    border:none;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- VIDEO FUNDO -->
<video autoplay muted loop id="bgvideo">
<source src="https://video-base-imf-sg.oss-ap-southeast-1.aliyuncs.com/public-uploads/temp/1769161468/1769161468726-home.mp4" type="video/mp4">
</video>

<!-- IMAGEM LADO DIREITO -->
<div class="lado-direito">
<img src="https://www.dropbox.com/scl/fi/gftswitawxtqxxoaay77l/aviator.jpg_play_BR.jpg?rlkey=desyqp89aktbsyuczxukatjz6&st=4e6pu09r&dl=1">
</div>

<!-- BOTÃO LINK DIRETO -->
<a class="botao-link" href="https://7k.bet.br?ref=7ead66af93da" target="_blank">
🔼 ENTRAR AGORA
</a>

<header style="text-align:center;padding:15px;">
<h1>🎤 KARAOKÊ SHOW ONLINE</h1>
<p>Escolha e cante 🎶</p>
</header>

<main class="container">

<section class="player">
<iframe id="video"
src="https://www.youtube.com/embed/videoseries?list=PLhgX6O9sLdD757_SdGmHp-p5j3djuTl5t"
allowfullscreen></iframe>
</section>

<section class="controls">
<button onclick="minha()">🎤 Minha Playlist</button>
<button onclick="gospel()">🙏 Gospel Playlist</button>
<button onclick="trocar('karaoke gospel harpa louvor')">🎶 Gospel</button>
<button onclick="trocar('karaoke sertanejo raiz e atual')">🤠 Sertanejo</button>
<button onclick="trocar('karaoke flashback anos 80 90')">🕺 Flashback</button>
<button onclick="trocar('karaoke musica popular brasileira')">🎤 Popular</button>
<button onclick="trocar('playback banda labaredas karaoke')">🔥 Banda Labaredas</button>
</section>

</main>

<script src="scripts/app.js"></script>
</body>
</html>
