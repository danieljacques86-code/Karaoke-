<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
    :root { --cor-principal: #e50914; --fundo: #0a0a0a; --card: #1a1a1a; }
    body { background-color: var(--fundo); color: white; font-family: Arial, sans-serif; margin: 0; }
    
    header { padding: 20px; text-align: center; background: #000; border-bottom: 2px solid var(--cor-principal); }
    #busca { width: 80%; max-width: 400px; padding: 10px; border-radius: 20px; border: none; outline: none; }

    .container { padding: 20px; }
    .titulo-categoria { font-size: 22px; margin: 20px 0 10px; color: var(--cor-principal); font-weight: bold; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    .card { background: var(--card); border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid #333; }
    .card:hover { transform: scale(1.05); border-color: var(--cor-principal); }
    .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
    .card-txt { padding: 8px; font-size: 13px; text-align: center; font-weight: bold; }

    /* JANELA DO PLAYER */
    #janela-player { 
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: #000; z-index: 9999; flex-direction: column; 
    }
    .topo-player { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #111; }
    #video-obj { flex-grow: 1; width: 100%; outline: none; }
    .btn-fechar { background: var(--cor-principal); color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; }

    /* OVERLAYS (IMAGEM E BOTÃO) */
    #overlay-img {
        display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: black; z-index: 10001; justify-content: center; align-items: center;
    }
    #overlay-img img { max-width: 100%; max-height: 100%; }

    #btn-teste {
        display: none; position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
        background: var(--cor-principal); color: white; padding: 15px 30px; 
        text-decoration: none; font-weight: bold; border-radius: 50px; z-index: 10002;
        box-shadow: 0 0 20px rgba(229, 9, 20, 0.5); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { scale: 1; } 50% { scale: 1.1; } 100% { scale: 1; } }
</style>

<header>
    <h1 style="margin:0 0 10px 0;">VODCINE PRO</h1>
    <input type="text" id="busca" placeholder="Pesquisar..." onkeyup="filtrar()">
</header>

<div class="container" id="vitrine">
    <p style="text-align:center;">A carregar lista do Dropbox...</p>
</div>

<div id="janela-player">
    <div class="topo-player">
        <span id="nome-video">A carregar...</span>
        <button class="btn-fechar" onclick="fechar()">VOLTAR</button>
    </div>
    
    <div id="overlay-img">
        <img src="https://dl.dropboxusercontent.com/scl/fi/7pvxcro7rfyep7y3z9awg/5154646941106285827_120.jpg?rlkey=o1w4hyoc60zqqcjsnqb8xvv3l&dl=1" alt="Aguarde...">
    </div>

    <a href="https://testeagora.tv/logtvseries" target="_blank" id="btn-teste">CLIQUE AQUI PARA FAZER TESTE</a>

    <video id="video-obj" controls playsinline referrerpolicy="no-referrer"></video>
</div>

<script>
    const URL_LISTA = "https://dl.dropboxusercontent.com/scl/fi/1h444ydk3srdoccm3pue3/VODCINE.txt?rlkey=xpz9bxd2z095ajy1jva4oe2lz";
    let hlsEngine = new Hls();
    let timerTeste;

    async function carregarDados() {
        try {
            const resposta = await fetch(URL_LISTA);
            const texto = await resposta.text();
            organizar(texto);
        } catch (erro) {
            document.getElementById('vitrine').innerHTML = "Erro ao carregar ficheiro M3U.";
        }
    }

    function organizar(conteudo) {
        const linhas = conteudo.split('\n');
        const categorias = {};
        for (let i = 0; i < linhas.length; i++) {
            if (linhas[i].includes('#EXTINF')) {
                const url = linhas[i+1] ? linhas[i+1].trim() : "";
                if (url.startsWith('http')) {
                    const nome = linhas[i].split(',')[1] || "Sem Nome";
                    const capa = (linhas[i].match(/tvg-logo="([^"]+)"/) || [])[1] || "";
                    const cat = (linhas[i].match(/group-title="([^"]+)"/) || [])[1] || "Geral";
                    if (!categorias[cat]) categorias[cat] = [];
                    categorias[cat].push({ nome, capa, url });
                }
            }
        }
        exibir(categorias);
    }

    function exibir(grupos) {
        const vitrine = document.getElementById('vitrine');
        vitrine.innerHTML = "";
        for (const [titulo, itens] of Object.entries(grupos)) {
            const seccao = document.createElement('div');
            seccao.innerHTML = `<div class="titulo-categoria">${titulo}</div><div class="grid"></div>`;
            itens.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => abrir(item.url, item.nome);
                card.innerHTML = `<img src="${item.capa}" onerror="this.src='https://via.placeholder.com/200x300?text=Sem+Capa'"><div class="card-txt">${item.nome}</div>`;
                seccao.querySelector('.grid').appendChild(card);
            });
            vitrine.appendChild(seccao);
        }
    }

    function abrir(url, nome) {
        const playerDiv = document.getElementById('janela-player');
        const video = document.getElementById('video-obj');
        const overlay = document.getElementById('overlay-img');
        const btnTeste = document.getElementById('btn-teste');
        
        document.getElementById('nome-video').innerText = nome;
        let linkFinal = url.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
        
        // Reset de estados
        playerDiv.style.display = 'flex';
        overlay.style.display = 'flex';
        btnTeste.style.display = 'none';
        clearTimeout(timerTeste);

        // 1. Mostrar imagem por 5 segundos
        setTimeout(() => {
            overlay.style.display = 'none';
            
            // Iniciar Vídeo
            if (linkFinal.includes('.m3u8') || linkFinal.includes('.ts')) {
                if (Hls.isSupported()) {
                    hlsEngine.loadSource(linkFinal);
                    hlsEngine.attachMedia(video);
                    hlsEngine.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                } else {
                    video.src = linkFinal; video.play();
                }
            } else {
                hlsEngine.detachMedia();
                video.src = linkFinal; video.play();
            }

            // 2. Agendar botão de teste para daqui a 5 minutos (300000 ms)
            timerTeste = setTimeout(() => {
                btnTeste.style.display = 'block';
            }, 300000);

        }, 5000); // 5000 ms = 5 segundos
    }

    function fechar() {
        const v = document.getElementById('video-obj');
        v.pause();
        hlsEngine.detachMedia();
        v.src = "";
        document.getElementById('janela-player').style.display = 'none';
        document.getElementById('btn-teste').style.display = 'none';
        clearTimeout(timerTeste);
    }

    function filtrar() {
        let termo = document.getElementById('busca').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(termo) ? "" : "none";
        });
    }

    window.onload = carregarDados;
</script>
