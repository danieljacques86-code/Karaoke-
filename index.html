<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA IPTV</title>

<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:#fff;
overflow:hidden;
}

/* FUNDO NEON */
#bg{
position:fixed;
width:100%;
height:100%;
z-index:-1;
object-fit:cover;
}

/* LOGIN */
#login{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#000000d9;
padding:30px;
border-radius:15px;
box-shadow:0 0 40px #00eaff;
text-align:center;
}

input{
padding:12px;
margin:8px;
border:none;
border-radius:8px;
width:220px;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
background:#00eaff;
font-weight:bold;
}

/* APP */
#app{display:none;text-align:center;padding-top:30px;}

.logo{
font-size:45px;
font-weight:bold;
background:linear-gradient(90deg,#00eaff,#0066ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:25px;
}

.menu{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:18px;
}

.card{
width:130px;
height:110px;
background:#001a2a;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
cursor:pointer;
box-shadow:0 0 20px #000;
transition:.3s;
}

.card:hover{
transform:scale(1.1);
box-shadow:0 0 25px #00eaff;
}

/* PLAYER */
#playerBox{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#000;
padding:8px;
display:none;
}

video,audio{
width:100%;
height:260px;
background:#000;
}

/* BOTÕES */
.links{
display:flex;
gap:8px;
flex-wrap:wrap;
justify-content:center;
margin-top:5px;
}

.links button{
background:#000;
color:#fff;
border:1px solid #00eaff;
}

/* PAINEL SECRETO */
#admin{
display:none;
position:fixed;
top:10%;
left:50%;
transform:translateX(-50%);
background:#000;
padding:20px;
border-radius:15px;
box-shadow:0 0 30px red;
width:90%;
max-width:500px;
}

textarea{
width:100%;
height:200px;
background:#111;
color:#0f0;
}
</style>
</head>

<body>

<!-- FUNDO VIDEO -->
<video autoplay muted loop id="bg">
<source src="https://cdn.coverr.co/videos/coverr-blue-neon-tunnel-8765/1080p.mp4" type="video/mp4">
</video>

<!-- LOGIN -->
<div id="login">
<h2>PAINEL IPTV</h2>
<input id="user" placeholder="Usuário"><br>
<input id="pass" type="password" placeholder="Senha"><br>
<button onclick="logar()">ENTRAR</button>
</div>

<!-- APP -->
<div id="app">
<div class="logo" id="logo">ULTRA IPTV</div>

<div class="menu">
<div class="card" onclick="abrir('tv')">📺<br>TV</div>
<div class="card" onclick="abrir('filmes')">🎬<br>Filmes</div>
<div class="card" onclick="abrir('series')">🍿<br>Séries</div>
<div class="card" onclick="abrir('lista')">📂<br>Lista</div>
<div class="card" onclick="abrir('radio')">📻<br>Rádio</div>
</div>
</div>

<!-- PLAYER -->
<div id="playerBox">
<video id="player" controls autoplay></video>
<audio id="radioPlayer" controls autoplay style="display:none"></audio>
<div class="links" id="botoes"></div>
</div>

<!-- PAINEL SECRETO -->
<div id="admin">
<h3>Painel secreto</h3>
<p>Troque os links (1 por linha)</p>
<textarea id="editor"></textarea><br><br>
<button onclick="salvar()">SALVAR</button>
<button onclick="fecharAdmin()">FECHAR</button>
</div>

<script>
let playlists={
tv:["link1","link2","link3","link4","link5"],
filmes:["http://hubby.run:80/movie/playcine-vods/gKQJjXulgb/644556.mp4","link2","link3","link4","link5"],
series:["link1","link2","link3","link4","link5"],
lista:["link1","link2","link3","link4","link5"],
radio:["https://stream.zeno.fm/f3wvbbqmdg8uv"]
};

function logar(){
let u=user.value;
let p=pass.value;

if(u=="admin" && p=="1234"){
login.style.display="none";
app.style.display="block";
}else alert("Senha errada");
}

/* abrir categoria */
function abrir(tipo){
playerBox.style.display="block";
let botoes=document.getElementById("botoes");
botoes.innerHTML="";

if(tipo=="radio"){
player.style.display="none";
radioPlayer.style.display="block";
}else{
radioPlayer.style.display="none";
player.style.display="block";
}

playlists[tipo].forEach((l,i)=>{
let b=document.createElement("button");
b.innerText="Link "+(i+1);
b.onclick=()=>tocar(l,tipo);
botoes.appendChild(b);
});

tocar(playlists[tipo][0],tipo);
}

function tocar(link,tipo){
if(tipo=="radio"){
radioPlayer.src=link;
radioPlayer.play();
}else{
player.src=link;
player.play();
}
}

/* painel secreto segurar logo */
let timer;
logo.addEventListener("touchstart",()=>{
timer=setTimeout(()=>abrirAdmin(),4000);
});
logo.addEventListener("touchend",()=>clearTimeout(timer));

logo.addEventListener("mousedown",()=>{
timer=setTimeout(()=>abrirAdmin(),4000);
});
logo.addEventListener("mouseup",()=>clearTimeout(timer));

function abrirAdmin(){
admin.style.display="block";
editor.value=JSON.stringify(playlists,null,2);
}

function fecharAdmin(){
admin.style.display="none";
}

function salvar(){
playlists=JSON.parse(editor.value);
alert("Salvo!");
admin.style.display="none";
}
</script>

</body>
</html>
