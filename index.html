<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IPTV M3U8 Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Video.js (for HLS/M3U8 playback) -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.min.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #222;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>IPTV M3U8 Player</h1>

    <video
      id="stream-player"
      class="video-js vjs-default-skin vjs-16-9"
      controls
      preload="auto"
      data-setup="{}">
      <source src="http://infogovsp.org:80/live/zw8w59/9sfcai/227506.m3u8" type="application/x-mpegURL" />
      Your browser does not support the video tag with HLS.
    </video>
  </div>

  <script>
    const player = videojs("stream-player");
    // Optional: autoplay (may be blocked by browser)
    // player.play();
  </script>
</body>
</html>
