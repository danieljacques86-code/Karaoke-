<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blogflixtv</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="style.css">

</head>
<body>

<h1>🎬 Blogflixtv</h1>

<!-- LOGIN -->
<div id="loginBox">

<div id="g_id_onload"
     data-client_id="SEU_CLIENT_ID"
     data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin"
     data-type="standard"
     data-theme="filled_black"
     data-size="large">
</div>

</div>

<!-- AREA LOGADA -->
<div id="app" style="display:none;">

<div id="userInfo"></div>

<h2>Área VIP 🔒</h2>

<div class="cards">
    <div class="card" onclick="playVideo('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
        ▶ Canal 1
    </div>

    <div class="card" onclick="playVideo('https://test-streams.mux.dev/test_001/stream.m3u8')">
        ▶ Canal 2
    </div>
</div>

<video id="player" controls autoplay></video>

<br><br>
<button onclick="logout()">Sair</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="app.js"></script>

</body>
</html>
