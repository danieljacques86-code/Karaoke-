<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Karaoke + SportLive Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://vjs.zencdn.net/8.10.0/video-js.min.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f5f5f5;
      color: #222;
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .loading {
      display: block;
      color: #666;
      font-size: 14px;
      margin-top: 8px;
    }
    #channel-list {
      margin-top: 12px;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 8px;
      background: #fff;
      border-radius: 6px;
      font-size: 14px;
    }
    #channel-list button {
      display: block;
      width: 100%;
      margin: 4px 0;
      padding: 8px;
      text-align: left;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f9f9f9;
      cursor: pointer;
    }
    #channel-list button:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Karaoke + SportLive Player</h1>

    <video
      id="stream-player"
      class="video-js vjs-default-skin vjs-16-9"
      controls
      preload="auto"
      data-setup="{}">
      <p class="vjs-no-js">JavaScript necessário para ver o stream.</p>
    </video>

    <p id="status" class="loading">Carregando lista de canais...</p>
    <div id="channel-list"></div>
  </div>

  <script>
    const player = videojs("stream-player");
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("channel-list");

    const M3U_URL =
      "https://raw.githubusercontent.com/danieljacques86-code/Karaoke-/refs/heads/main/lista.m3u";

    fetch(M3U_URL)
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.text();
      })
      .then((rawText) => {
        const lines = rawText.split("
");
        const channels = [];
        let currentName = null;
        let count = 0;

        for (const line of lines) {
          if (line.trim().startsWith("#EXTINF")) {
            const nameMatch = line.match(/,(.+)$/);
            currentName = nameMatch ? nameMatch[1].trim() : "Canal " + ++count;
          } else if (
            line.trim().startsWith("http") &&
            currentName &&
            channels.length < 200
          ) {
            channels.push({ name: currentName, url: line.trim() });
            currentName = null;
          }
        }

        if (channels.length === 0) {
          statusEl.textContent = "Nenhum canal encontrado na lista.";
          return;
        }

        statusEl.textContent =
          `⚠️ Lista carregada (${channels.length} canais).`;

        channels.forEach((ch, i) => {
          const btn = document.createElement("button");
          btn.textContent = `${i + 1} - ${ch.name}`;
          btn.dataset.url = ch.url;
          btn.addEventListener("click", () => changeChannel(ch.url));
          listEl.appendChild(btn);
        });

        if (channels[0]) changeChannel(channels[0].url);
      })
      .catch((err) => {
        statusEl.innerHTML =
          `Erro ao carregar a lista:<br><code>${err.message}</code>`;
        console.error("Erro ao carregar M3U:", err);
      });

    function changeChannel(url) {
      if (!player) return;
      player.src({ src: url, type: "application/x-mpegURL" });
      player.load();
      player.play();
    }
  </script>
</body>
</html>
